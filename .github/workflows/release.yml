name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: VERSION="${GITHUB_REF_NAME#v}" ./build.sh "$PWD/build"

      - name: Package
        run: ditto -c -k --keepParent build/Cell.app Cell.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Cell
          path: Cell.zip

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: Cell.zip
